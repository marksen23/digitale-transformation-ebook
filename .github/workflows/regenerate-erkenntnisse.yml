name: Erkenntnisse neu erzeugen

# Inkrementell: neue Kernsatz-Entwürfe und Master nur für Anker mit genug
# neuen Varianten. Wenn sich nichts geändert hat, kein Commit.
#
# Sonntag 05:00 UTC, eine Stunde nach dem täglichen Auto-Curate (04:00 UTC).
# Zusätzlich einmalig, wenn .github/triggers/regenerate-erkenntnisse auf main
# geändert wird — workflow_dispatch ist dafür nicht nötig.
#
# Sind Stimme, Vollständigkeit und der Validator grün, geht das Ergebnis
# direkt nach main (wie die Log- und Snapshot-Commits), mit Retry bei
# non-fast-forward. Ein Fehlschlag kommentiert ein offenes Issue und legt
# nicht bei jedem Lauf ein neues an.

on:
  schedule:
    - cron: '0 5 * * 0'
  push:
    branches: [main]
    paths:
      - '.github/triggers/regenerate-erkenntnisse'
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: regenerate-erkenntnisse
  cancel-in-progress: false

jobs:
  regenerate:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v5
        with:
          fetch-depth: 0
          ref: ${{ github.ref_name }}

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115  # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: "24"
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Neue Kernsätze und fällige Master
        id: regen
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_FALLBACK: ${{ secrets.GEMINI_API_KEY_FALLBACK }}
          GEMINI_API_KEYS: ${{ secrets.GEMINI_API_KEYS }}
          PRESCORE_MODEL: gemini-2.5-pro
          SYNTHESIS_MODEL: gemini-2.5-pro
        run: |
          set -euo pipefail
          pnpm tsx scripts/regenerate-erkenntnisse.ts
          node <<'EOF'
          const fs = require("fs");
          const r = JSON.parse(fs.readFileSync("regenerate-erkenntnisse-report.json", "utf8"));
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `changed=${r.changed ? "true" : "false"}\n`);
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `index=${r.needsIndexRebuild ? "true" : "false"}\n`);
          EOF

      - name: Index aus dem lokalen Korpus bauen
        if: steps.regen.outputs.changed == 'true' && steps.regen.outputs.index == 'true'
        env:
          CORPUS_SOURCE: local
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_FALLBACK: ${{ secrets.GEMINI_API_KEY_FALLBACK }}
          GEMINI_API_KEYS: ${{ secrets.GEMINI_API_KEYS }}
          GEMINI_EMBED_MODEL: gemini-embedding-001
          EMBEDDINGS_REQUIRED: "1"
        run: pnpm tsx scripts/build-resonanzen-index.ts

      - name: Stimme und Vollständigkeit prüfen
        if: steps.regen.outputs.changed == 'true'
        run: pnpm exec vitest run scripts/__tests__/insightVoice.test.ts

      - name: Validator
        if: steps.regen.outputs.changed == 'true'
        run: pnpm tsx scripts/validate-resonanzen.ts

      - name: Bericht
        if: always()
        run: |
          if [ -f regenerate-erkenntnisse-report.json ]; then
            {
              echo "### Erkenntnisse neu erzeugen"
              echo '```json'
              node -e 'const r=require("./regenerate-erkenntnisse-report.json"); console.log(JSON.stringify({changed:r.changed,needsIndexRebuild:r.needsIndexRebuild,distilled:r.distilled,synthesized:r.synthesized,skippedMasters:r.skippedMasters,failures:r.failures,masters:r.masters},null,2))'
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Commit und Push auf main
        if: steps.regen.outputs.changed == 'true'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            content/resonanzen/master \
            client/public/resonanzen-erkenntnis-drafts.json \
            client/public/resonanzen-erkenntnis-withdrawn.json \
            client/public/resonanzen-erkenntnisse.json \
            client/public/resonanzen-index.json \
            client/public/resonanzen-embeddings.json \
            client/public/resonanzen-erkenntnis-candidates.json \
            client/public/resonanzen-questions.json \
            client/public/resonanzen-question-embeddings.json \
            client/public/resonanzen-anchor-clusters.json \
            client/public/resonanzen-corpus-map.json \
            client/public/resonanzen-holdout-baseline.json \
            client/public/resonanzen-holdout-report.json \
            client/public/resonanzen-node-density.json \
            client/public/resonanzen-link-predictions.json \
            client/public/resonanzen-concept-candidates.json \
            client/public/resonanzen-chapter-hashes.json \
            client/public/resonanzen-embedding-refresh.json
          if git diff --cached --quiet; then
            echo "Keine Änderungen."
            exit 0
          fi
          git commit -m "$(cat <<'EOF'
          feat(erkenntnisse): neue Kernsatz-Entwürfe und fällige Master

          Nur Anker mit genug neuen Varianten und Kandidaten ohne Entwurf.
          Unveränderte Erkenntnisse bleiben stehen.
          EOF
          )"
          BRANCH="${{ github.ref_name }}"
          if [ "$BRANCH" != "main" ]; then
            git push origin "HEAD:$BRANCH"
            exit 0
          fi

          keep_replayed() {
            local files f
            files=$(git diff --name-only --diff-filter=U 2>/dev/null || true)
            if [ -z "$files" ]; then
              echo "Rebase-Konflikt ohne Pfade"
              return 1
            fi
            while IFS= read -r f; do
              [ -z "$f" ] && continue
              case "$f" in
                client/public/*|content/resonanzen/master/*) ;;
                *)
                  echo "Konflikt außerhalb der erzeugten Dateien: $f"
                  return 1
                  ;;
              esac
              # Beim Rebase ist der neu aufgespielte Commit „theirs“.
              git checkout --theirs -- "$f"
              git add -- "$f"
            done <<< "$files"
            GIT_EDITOR=true git rebase --continue
          }

          for i in 1 2 3 4 5; do
            echo "--- Push auf main, Versuch $i ---"
            set +e
            PULL_OUT=$(git pull --rebase --autostash origin main 2>&1)
            PULL_RC=$?
            echo "$PULL_OUT"
            set -e
            if [ "$PULL_RC" -ne 0 ]; then
              if [ -d .git/rebase-merge ] || [ -d .git/rebase-apply ]; then
                if ! keep_replayed; then
                  git rebase --abort 2>/dev/null || true
                  exit 1
                fi
              else
                echo "pull fehlgeschlagen — erneut in $((2 * i))s"
                sleep $((2 * i))
                continue
              fi
            fi
            set +e
            PUSH_OUT=$(git push origin HEAD:main 2>&1)
            PUSH_RC=$?
            echo "$PUSH_OUT"
            set -e
            if [ "$PUSH_RC" -eq 0 ]; then
              echo "Push auf main gelungen"
              exit 0
            fi
            if echo "$PUSH_OUT" | grep -qiE 'GH006|protected branch|permission denied|403 Forbidden|denied to'; then
              echo "::error::Push auf main abgelehnt (Permissions oder Branch-Protection)."
              exit 1
            fi
            echo "non-fast-forward — erneut in $((2 * i))s"
            sleep $((2 * i))
          done
          echo "::error::Commit konnte nicht nach main gepusht werden."
          exit 1

      - name: Issue bei Fehlschlag
        if: failure()
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3  # v9.0.0
        with:
          script: |
            const fs = require('fs');
            const sha = context.sha.slice(0, 7);
            const run = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            let report = '';
            try {
              report = fs.readFileSync('regenerate-erkenntnisse-report.json', 'utf8').slice(0, 4000);
            } catch { report = '_kein Bericht_'; }
            const body = [
              `Lauf fehlgeschlagen bei \`${sha}\`.`,
              ``,
              run,
              ``,
              '<details><summary>Bericht</summary>',
              '',
              '```json',
              report,
              '```',
              '',
              '</details>',
            ].join('\n');
            const titlePrefix = '[Erkenntnisse neu erzeugen]';
            const { data: open } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 100,
            });
            const existing = open.find(issue => issue.title.startsWith(titlePrefix));
            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body,
              });
              core.info(`Kommentar auf #${existing.number}`);
            } else {
              const { data: created } = await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: `${titlePrefix} Lauf fehlgeschlagen (${sha})`,
                body,
              });
              core.info(`Issue #${created.number} angelegt`);
            }
