name: Daily History Snapshot

# Generiert täglich um 03:00 UTC einen aggregierten Snapshot des
# Resonanz-Korpus, baut Tages-Manifests und appended ans Quartals-Ledger.
# Manuell triggerbar via "Run workflow"-Button in GitHub Actions.

on:
  schedule:
    - cron: '0 3 * * *'   # täglich 03:00 UTC
  workflow_dispatch:       # manueller Trigger

permissions:
  contents: write           # Push der Snapshot-Files

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Action-SHAs gepinnt (Repo-Policy: keine Tag-Refs erlaubt)
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v5
        with:
          # Volle History, damit `git pull --rebase` vor dem Push nicht an
          # fehlenden Ancestors scheitert.
          fetch-depth: 0
          # Branch-Ref statt Trigger-SHA: checkout holt so den aktuellen Tip.
          # Auf demselben Branch committen, von dem der Workflow lief
          ref: ${{ github.ref }}

      # pnpm MUSS vor setup-node@v5 stehen — v5 liest packageManager aus
      # package.json und erwartet pnpm-Binär bereits im PATH.
      - name: Setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115  # v6.1.1
        with:
          run_install: false
          # Version kommt aus package.json packageManager-Feld

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: '24'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run snapshot script
        run: pnpm tsx scripts/snapshot-history.ts

      - name: Commit & push if changed
        run: |
          git config user.name  "history-snapshot-bot"
          git config user.email "history-snapshot-bot@users.noreply.github.com"
          git add content/history/
          if git diff --cached --quiet; then
            echo "Keine Änderungen — kein Commit."
            exit 0
          fi
          DATE=$(date -u +%Y-%m-%d)
          git commit -m "history: daily snapshot $DATE [bot]"
          # Live-Append committet jederzeit auf main. Ein nackter `git push`
          # scheitert dann non-fast-forward. Darum vor jedem Versuch auf den
          # aktuellen Branch-Tip rebasen (content/history/ schreibt nur dieser
          # Workflow → keine inhaltlichen Konflikte zu erwarten).
          BRANCH="${{ github.ref_name }}"
          for i in 1 2 3 4 5; do
            git pull --rebase origin "$BRANCH"
            echo "[base] triggered=${{ github.sha }} built-on=$(git rev-parse HEAD~1) attempt=$i"
            if git push origin "HEAD:$BRANCH"; then
              echo "Push gelungen (Versuch $i)"
              exit 0
            fi
            echo "Push abgelehnt — erneut in $((2 * i))s"
            sleep $((2 * i))
          done
          echo "::error::Snapshot konnte nicht gepusht werden."
          exit 1
