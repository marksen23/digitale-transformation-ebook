name: Fix Orphan Leitmotiv-IDs

# Manuell triggerbar: repariert Resonanz-Files, deren nodeIds noch das
# alte unprefixierte Format ("begegnung") statt des korrekten lm-Prefix
# ("lm-begegnung") nutzen. Mappt automatisch alle 5 Leitmotiv-Knoten.
#
# Nutzt GITHUB_TOKEN der Action (contents:write), kein eigener PAT nötig.

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry-Run (nur Anzeige, keine Änderungen)"
        required: false
        default: "false"
        type: choice
        options: ["false", "true"]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v5

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115  # v6.1.1
        # Version aus package.json packageManager-Feld

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: "24"
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Fix orphans
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            pnpm tsx scripts/fix-orphan-leitmotive.ts --dry-run
          else
            pnpm tsx scripts/fix-orphan-leitmotive.ts
          fi
