name: CI (check + test)

# Schneller Code-Quality-Gate: tsc (pnpm check) + vitest (pnpm test).
# KEINE Gemini-Calls, keine Schreibrechte — rein verifizierend, ~1-2 min.
#
# Läuft NUR bei echten CODE-Änderungen. Bewusst client/src/** statt client/**:
# der Korpus-Bot committet ständig nach client/public/*.json (Snapshots,
# Index) + content/resonanzen/** (AI-Logs) — diese Daten-Auto-Commits sollen
# KEINEN CI-Lauf triggern (der Korpus wird von validate-corpus.yml geprüft).
on:
  push:
    branches: [main]
    paths:
      - "client/src/**"
      - "server/**"
      - "scripts/**"
      - "shared/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "tsconfig.json"
      - "vitest.config.ts"
      - "vite.config.ts"
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      # Action-SHAs gepinnt (Repo-Policy: keine Tag-Refs). Gleiche Versionen
      # wie validate-corpus.yml.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v5
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115  # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: "24"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Typecheck (tsc --noEmit)
        run: pnpm check
      - name: Unit-Tests (vitest)
        run: pnpm test
